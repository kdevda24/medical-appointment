<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login</title>
</head>
<body>
    <form style="max-width: 320px; margin: auto; background-color: #ffffff; border: 1px solid #cccccc; padding: 24px;">
 
        <h1 style="font-size: 20px; margin: 20px; text-align: center;">Patient Login</h1>
     
        <label for="email" style="display: block; font-weight: bold; margin-bottom: 4px;">Email</label>
        <input type="email" id="email" name="email" style="width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #cccccc; box-sizing: border-box;">
     
        <label for="password" style="display: block; font-weight: bold; margin-bottom: 4px;">Password</label>
        <input type="password" id="password" name="password" style="width: 100%; padding: 8px; margin-bottom: 20px; border: 1px solid #cccccc; box-sizing: border-box;">
     
        <button type="submit" style="width: 100%; padding: 10px; background-color: #2f4b7c; color: #ffffff; border: none; cursor: pointer;">Log In</button>
     
      </form>
</body>
</html>
