<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Request</title>
</head>
<body>
    <form style="max-width: 320px; margin: 0 auto; background-color: #ffffff; border: 1px solid #cccccc; padding: 24px;">
 
        <h1 style="font-size: 20px; margin: 0 0 20px 0; text-align: center;">Appointment Request</h1>
     
        <label for="name" style="display: block; font-weight: bold; margin-bottom: 4px;">Full Name</label>
        <input type="text" id="name" name="name" style="width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #cccccc; box-sizing: border-box;">
     
        <label for="date" style="display: block; font-weight: bold; margin-bottom: 4px;">Preferred Date</label>
        <input type="date" id="date" name="date" style="width: 100%; padding: 8px; margin-bottom: 16px; border: 1px solid #cccccc; box-sizing: border-box;">
     
     
        <label for="reason" style="display: block; font-weight: bold; margin-bottom: 4px;">Reason for Visit</label>
        <input type="text" id="reason" name="reason" style="width: 100%; padding: 8px; margin-bottom: 20px; box-sizing: border-box;">
     
        <button type="submit" style="width: 100%; padding: 10px; background-color: #2f4b7c; color: #ffffff; border: none; cursor: pointer;">Submit Request</button>
     
      </form>
</body>
</html>
