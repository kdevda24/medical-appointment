<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>

    <h1>Spacing and Layout</h1>
 
  <div class="row">
    <div class="box">
      <p>Box 1</p>
      <p>This box sits next to Box 2 on wider screens.</p>
    </div>
    <div class="box">
      <p>Box 2</p>
      <p>Below 600px wide, these boxes stack on top of each other instead.</p>
    </div>
  </div>
    
</body>
</html>
