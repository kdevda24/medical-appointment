<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <link rel="stylesheet" href="event-reg.css">
    
</head>
<body>

    <h1>Event Registration</h1>
 
    <form id="main">
 
        <div class="row">
            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
        </div>
 
        <label for="date">Preferred Date</label>
        <input type="date" id="date" name="date">
 
        <label for="ticket">Ticket Type</label>
        <select id="ticket" name="ticket">
            <option value="general">General Admission</option>
            <option value="student">Student</option>
            <option value="vip">VIP</option>
        </select>
 
        <label for="count">Number of Tickets</label>
        <input type="number" id="count" name="count" min="1" value="1">
 
        <button type="submit">Register</button>
 
        <p id="error-message"></p>
 
    </form>
 
    <h2>My Registrations</h2>
    <div id="registrations"></div>
 
    <h2>Upcoming Events</h2>
    <div id="events-status">Loading...</div>
    <div id="events-list"></div>


    <script src="event.js"></script>

    
</body>
</html>
